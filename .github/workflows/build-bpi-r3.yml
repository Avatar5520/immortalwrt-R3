name: Build ImmortalWrt BPI-R3 (ETU ES8524 2.5G)
on:
  workflow_dispatch:
    inputs:
      immortalwrt_branch:
        description: 'ImmortalWrt 分支或版本標籤 (例如 v25.12.2 或 openwrt-25.12)'
        required: true
        default: 'v25.12.2'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 檢出本倉庫配置
        uses: actions/checkout@v4

      - name: 2. 安裝 Ubuntu 編譯依賴環境
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
          lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
          python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 3. 下載 ImmortalWrt 官方源碼
        run: |
          REPO_URL="https://github.com""/immortalwrt/immortalwrt.git"
          git clone --depth 1 --branch ${{ github.event.inputs.immortalwrt_branch }} "$REPO_URL" immortalwrt

      - name: 4. 更新並安裝 Feeds 套件庫
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4.5 啟用編譯工具鏈及源碼快取 (加速日後編譯 R3/R4)
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/dl
            immortalwrt/staging_dir/host*
          key: immortalwrt-${{ github.event.inputs.immortalwrt_branch }}-${{ hashFiles('seed.config') }}
          restore-keys: |
            immortalwrt-${{ github.event.inputs.immortalwrt_branch }}-
            immortalwrt-

      - name: 5. 生成 Linux 6.12 內核 ETU ES8524 2.5G 標準補丁
        working-directory: immortalwrt
        run: |
          cp ../seed.config .config
          make defconfig
          make target/linux/prepare V=s
          
          LINUX_DIR=$(find build_dir/target-* -maxdepth 2 -name "linux-6.12.*" -type d | head -n 1)
          SFP_REL="drivers/net/phy/sfp.c"
          cp "$LINUX_DIR/$SFP_REL" "$LINUX_DIR/$SFP_REL.orig"
          
          python3 -c '
          import sys
          path = sys.argv[1]
          with open(path, "r") as f:
              lines = f.readlines()
          
          out = []
          block = []
          in_target = False
          inserted = False
          
          for line in lines:
              if "3FE46541AA" in line and not inserted:
                  in_target = True
              
              if in_target:
                  block.append(line)
                  out.append(line)
                  if line.rstrip().endswith("),"):
                      new_block = [
                          l.replace("ALCATELLUCENT", "ETU")
                           .replace("ALCATEL", "ETU")
                           .replace("3FE46541AA", "ES8524-3LCD03")
                          for l in block
                      ]
                      out.extend(new_block)
                      in_target = False
                      inserted = True
              else:
                  out.append(line)
          
          assert inserted, "找不到完整的 3FE46541AA 區塊"
          with open(path, "w") as f:
              f.writelines(out)
          ' "$LINUX_DIR/$SFP_REL"
          
          mkdir -p target/linux/generic/hack-6.12
          (cd "$LINUX_DIR" && diff -u --label "a/$SFP_REL" --label "b/$SFP_REL" "$SFP_REL.orig" "$SFP_REL" || true) > target/linux/generic/hack-6.12/999-sfp-etu-es8524.patch
          rm -f "$LINUX_DIR/$SFP_REL.orig"

          echo "=== 驗證生成的 Patch 內容 ==="
          cat target/linux/generic/hack-6.12/999-sfp-etu-es8524.patch

      - name: 5.5 配置開機自動修復 APK 軟件源
        working-directory: immortalwrt
        run: |
          mkdir -p files/etc/uci-defaults
          printf '#!/bin/sh\nsed -i "s|mirrors.vsean.net/immortalwrt|downloads.immortalwrt.org|g" /etc/apk/repositories.d/*.list 2>/dev/null || true\nsed -i "s|mirrors.vsean.net/openwrt|downloads.immortalwrt.org|g" /etc/apk/repositories.d/*.list 2>/dev/null || true\nexit 0\n' > files/etc/uci-defaults/99-fix-apk-repo
          chmod +x files/etc/uci-defaults/99-fix-apk-repo

      - name: 6. 下載所有套件源碼包
        working-directory: immortalwrt
        run: make download -j$(nproc)

      - name: 7. 開始編譯 ImmortalWrt BPI-R3 固件
        working-directory: immortalwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: 8. 上傳編譯完成嘅固件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ github.event.inputs.immortalwrt_branch }}-BPI-R3-ES8524
          path: immortalwrt/bin/targets/mediatek/filogic/*bananapi_bpi-r3*sysupgrade*
